<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open in Vision Board · Vision Board</title>
<meta name="robots" content="noindex">
<style>:root {
  color-scheme: light;
  --ink: #2B2520;
  --ink-muted: #6E655C;
  --paper: #FDF8F3;
  --paper-raised: #FFFFFF;
  --edge: #EDE3D8;
  --accent: #7C5CBF;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 44rem; margin: 0 auto; padding: 4rem 1.5rem 6rem; }
header { border-bottom: 1px solid var(--edge); padding-bottom: 2rem; margin-bottom: 2.5rem; }
h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 .5rem; letter-spacing: -0.02em; }
h2 { font-size: 1.125rem; margin: 2.5rem 0 .75rem; letter-spacing: -0.01em; }
p, li { color: var(--ink); margin: 0 0 1rem; }
ul { padding-left: 1.25rem; }
.meta { color: var(--ink-muted); font-size: .875rem; margin: 0; }
a { color: var(--accent); }
nav { margin-top: 1.25rem; font-size: .875rem; }
nav a { margin-right: 1rem; }
footer { margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--edge); color: var(--ink-muted); font-size: .875rem; }
.card { background: var(--paper-raised); border: 1px solid var(--edge); border-radius: 12px; padding: 1.25rem 1.5rem; margin: 1.5rem 0; }
label { display: block; color: var(--ink-muted); font-size: .875rem; }
input { display: block; width: 100%; margin: .25rem 0 1rem; padding: .6rem .75rem; border: 1px solid var(--edge); border-radius: 8px; font: inherit; color: var(--ink); background: var(--paper); }
button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: .7rem 1.1rem; font: inherit; cursor: pointer; }
.button { display: inline-block; background: var(--accent); color: #fff; border-radius: 8px; padding: .7rem 1.1rem; text-decoration: none; }
[hidden] { display: none !important; }</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Open in Vision Board</h1>
<p class="meta">Shared from the app.</p>
<nav>
<a href="./">Home</a><a href="privacy">Privacy</a><a href="terms">Terms</a><a href="support">Support</a>
</nav>
</header>
<div class="card">
<p id="lead">Someone shared a vision board with you. Open it in Vision Board.</p>
<p><a class="button" id="open" href="#" hidden>Open in Vision Board</a></p>
<p><a id="get" href="get?ct=board">Get Vision Board on the App Store</a></p>
<noscript><p>Open this link on an iPhone or iPad with Vision Board installed.</p></noscript>
</div>
<script>
(function () {
  var id = /^[A-Za-z0-9_-]{1,128}$/;
  var tag = /^[A-Za-z0-9_-]{1,64}$/;
  var params = new URLSearchParams(location.search);
  var out = new URLSearchParams();
  var board = params.get('boardId');
  var template = params.get('templateId');
  var isTemplate = !(board && id.test(board)) && Boolean(template && id.test(template));
  if (board && id.test(board)) out.set('boardId', board);
  else if (isTemplate) out.set('templateId', template);
  else return;
  // In the order services/shareService.ts writes them.
  var source = params.get('source');
  if (source && tag.test(source)) out.set('source', source);
  if (isTemplate) {
    var market = params.get('marketplaceTemplateId');
    if (market && id.test(market)) out.set('marketplaceTemplateId', market);
    document.getElementById('lead').textContent =
      'Someone shared a vision board template with you. Start your own board from it in Vision Board.';
    document.getElementById('get').setAttribute('href', 'get?ct=template');
  }
  var open = document.getElementById('open');
  open.setAttribute('href', 'visionboard://board?' + out.toString());
  open.hidden = false;
})();
</script>
<footer>
<p>Vision Board · <a href="mailto:cankanbur1@gmail.com">cankanbur1@gmail.com</a></p>
</footer>
</div>
</body>
</html>
