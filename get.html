<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vision Board · App Store</title>
<noscript><meta http-equiv="refresh" content="0;url=https://apps.apple.com/app/apple-store/id6817712255?mt=8"></noscript>
<script>
(function () {
  var ct = (new URLSearchParams(location.search).get('ct') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40);
  var u = new URL("https://apps.apple.com/app/apple-store/id6817712255");
  
  if (ct) u.searchParams.set('ct', ct);
  u.searchParams.set('mt', '8');
  location.replace(u.toString());
})();
</script>
<style>:root {
  color-scheme: light;
  --ink: #2B2520;
  --ink-muted: #6E655C;
  --paper: #FDF8F3;
  --paper-raised: #FFFFFF;
  --edge: #EDE3D8;
  --accent: #7C5CBF;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 44rem; margin: 0 auto; padding: 4rem 1.5rem 6rem; }
header { border-bottom: 1px solid var(--edge); padding-bottom: 2rem; margin-bottom: 2.5rem; }
h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 .5rem; letter-spacing: -0.02em; }
h2 { font-size: 1.125rem; margin: 2.5rem 0 .75rem; letter-spacing: -0.01em; }
p, li { color: var(--ink); margin: 0 0 1rem; }
ul { padding-left: 1.25rem; }
.meta { color: var(--ink-muted); font-size: .875rem; margin: 0; }
a { color: var(--accent); }
nav { margin-top: 1.25rem; font-size: .875rem; }
nav a { margin-right: 1rem; }
footer { margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--edge); color: var(--ink-muted); font-size: .875rem; }
.card { background: var(--paper-raised); border: 1px solid var(--edge); border-radius: 12px; padding: 1.25rem 1.5rem; margin: 1.5rem 0; }
label { display: block; color: var(--ink-muted); font-size: .875rem; }
input { display: block; width: 100%; margin: .25rem 0 1rem; padding: .6rem .75rem; border: 1px solid var(--edge); border-radius: 8px; font: inherit; color: var(--ink); background: var(--paper); }
button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: .7rem 1.1rem; font: inherit; cursor: pointer; }
.button { display: inline-block; background: var(--accent); color: #fff; border-radius: 8px; padding: .7rem 1.1rem; text-decoration: none; }
[hidden] { display: none !important; }</style>
</head>
<body>
<div class="wrap"><p>Opening the App Store… <a href="https://apps.apple.com/app/apple-store/id6817712255?mt=8">Continue</a></p></div>
</body>
</html>
